name: Deploy static site to S3
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Determine bucket name
        id: bucket
        run: |
          BUCKET_NAME=$(echo "${{ github.repository_owner }}-${{ github.event.repository.name }}-bucket" | tr '[:upper:]' '[:lower:]')
          echo "BUCKET=$BUCKET_NAME" >> "$GITHUB_ENV"
      - name: Create bucket (ignore if exists)
        run: |
          aws s3api create-bucket --bucket "$BUCKET" || true
      - name: Configure bucket website
        run: |
          aws s3 website "s3://$BUCKET" --index-document index.html
      - name: Public access block
        run: |
          aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
      - name: Bucket policy
        run: |
          aws s3api put-bucket-policy --bucket "$BUCKET" --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicReadGetObject\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::$BUCKET/*\"]}]}"
      - name: Sync site
        run: |
          aws s3 sync . "s3://$BUCKET" --delete --exclude ".git/*" --exclude ".github/*"
      - name: Output website URL
        run: |
          echo "Website URL: http://$BUCKET.s3-website-${{ vars.AWS_REGION }}.amazonaws.com"
